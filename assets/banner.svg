<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0e2a30" stroke-width="1"/></pattern>
<linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset="0.5" stop-color="#00F0FF" stop-opacity="1"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></linearGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="70%"><stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.95"/></radialGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.name{font:800 66px 'Segoe UI',Arial,Helvetica,sans-serif;letter-spacing:4px;fill:#fff}
.sub{font:700 21px 'Courier New',monospace;letter-spacing:5px;fill:#00F0FF}
.tag{font:700 16px 'Courier New',monospace;letter-spacing:3px;fill:#8B9BB4}
.flick{animation:fl 6s infinite}
@keyframes fl{0%,91%,100%{opacity:1}92%{opacity:.7}93%{opacity:1}95%{opacity:.8}96%{opacity:1}}
.bar{animation:mv 5s linear infinite}
.bar2{animation:mv 7s linear infinite reverse}
@keyframes mv{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
</style>
<rect width="1200" height="320" fill="#000"/>
<rect width="1200" height="320" fill="url(#g)"/>
<rect width="1200" height="320" fill="url(#vig)"/>
<g stroke="#00F0FF" stroke-width="3" fill="none">
<path d="M24 60V24H60"/><path d="M1140 24H1176V60"/><path d="M24 260V296H60"/><path d="M1140 296H1176V260"/>
</g>
<g class="bar"><rect x="0" y="0" width="400" height="3" fill="url(#scan)"/></g>
<g class="bar2"><rect x="0" y="317" width="400" height="3" fill="url(#scan)"/></g>
<g class="flick" filter="url(#glow)"><text x="600" y="168" text-anchor="middle" class="name">MD. SHAHRIAR RAHMAN</text></g>
<line x1="330" y1="196" x2="870" y2="196" stroke="#00F0FF" stroke-opacity=".6" stroke-width="2"/>
<text x="600" y="238" text-anchor="middle" class="sub">CSE UNDERGRAD  •  WEB  •  EMBEDDED  •  PROBLEM SOLVER</text>
<text x="600" y="282" text-anchor="middle" class="tag">[ python · c++ · arduino · web ]<tspan class="blink" fill="#00F0FF">_</tspan></text>
